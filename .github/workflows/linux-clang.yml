name: Linux Clang

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.tls.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]
        clang: [20]
        std: [23]
        tls:
          - { name: No TLS,  backend: none }
          - { name: wolfSSL, backend: wolfssl, vcpkg_port: "wolfssl[asio]" }
          - { name: OpenSSL, backend: openssl, vcpkg_port: openssl }

    env:
      CC: clang-${{ matrix.clang }}
      CXX: clang++-${{ matrix.clang }}
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - uses: actions/checkout@v6

      - name: Remove Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*

      - name: Setup Clang
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm
          llvm-version: ${{ matrix.clang }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-${{ matrix.clang }}-dev libc++abi-${{ matrix.clang }}-dev libunwind-${{ matrix.clang }}-dev

      - name: Setup vcpkg
        if: matrix.tls.vcpkg_port
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 29f10019c26142cc4689b53b8c91da519db09e5c

      - name: Install ${{ matrix.tls.name }} (vcpkg)
        if: matrix.tls.vcpkg_port
        run: |
          "$VCPKG_ROOT/vcpkg" install "${{ matrix.tls.vcpkg_port }}" --triplet "${VCPKG_DEFAULT_TRIPLET}"

      - name: Configure CMake
        shell: bash
        run: |
          vcpkg_cmake_args=()
          if [[ -n "${{ matrix.tls.vcpkg_port }}" ]]; then
            vcpkg_cmake_args+=("-DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake")
            vcpkg_cmake_args+=("-DVCPKG_TARGET_TRIPLET=${VCPKG_DEFAULT_TRIPLET}")
          fi

          cmake -B "${{ github.workspace }}/build-${{ matrix.tls.backend }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DCMAKE_C_COMPILER=${{ env.CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi" \
            -DAERO_TLS_BACKEND=${{ matrix.tls.backend }} \
            "${vcpkg_cmake_args[@]}"

      - name: Build
        run: cmake --build "build-${{ matrix.tls.backend }}" --parallel

      - name: Test
        working-directory: "build-${{ matrix.tls.backend }}"
        run: ctest --output-on-failure --parallel --timeout 30
