name: Linux GCC

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.tls.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: gcc:15

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]
        gcc: [15.2]
        std: [23]
        tls:
          - { name: No TLS,  backend: none }
          - { name: wolfSSL, backend: wolfssl, vcpkg_port: "wolfssl[asio]" }
          - { name: OpenSSL, backend: openssl, vcpkg_port: openssl }

    env:
      CC: gcc
      CXX: g++
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake git python3 curl zip unzip tar pkg-config
          update-ca-certificates

      - uses: actions/checkout@v6

      - name: Setup vcpkg
        if: matrix.tls.vcpkg_port
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 29f10019c26142cc4689b53b8c91da519db09e5c

      - name: Install ${{ matrix.tls.name }} (vcpkg)
        if: matrix.tls.vcpkg_port
        run: |
          "$VCPKG_ROOT/vcpkg" install "${{ matrix.tls.vcpkg_port }}" --triplet "${VCPKG_DEFAULT_TRIPLET}"

      - name: Configure CMake
        shell: bash
        run: |
          vcpkg_cmake_args=()
          if [[ -n "${{ matrix.tls.vcpkg_port }}" ]]; then
            vcpkg_cmake_args+=("-DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake")
            vcpkg_cmake_args+=("-DVCPKG_TARGET_TRIPLET=${VCPKG_DEFAULT_TRIPLET}")
          fi

          cmake -S . -B "build-${{ matrix.tls.backend }}" \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DCMAKE_CXX_STANDARD="${{ matrix.std }}" \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DAERO_TLS_BACKEND=${{ matrix.tls.backend }} \
            "${vcpkg_cmake_args[@]}"

      - name: Build
        run: cmake --build "build-${{ matrix.tls.backend }}" --parallel

      - name: Test
        working-directory: "build-${{ matrix.tls.backend }}"
        run: ctest --output-on-failure --parallel --timeout 30
