name: Sanitizers

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.sanitizer.name }}, ${{ matrix.tls.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug]
        clang: [20]
        std: [23]
        sanitizer:
          - { name: ASan+UBSan, flags: "-fsanitize=address,undefined", vcpkg_triplet: x64-linux-asan }
          - { name: TSan,       flags: "-fsanitize=thread",            vcpkg_triplet: x64-linux-tsan }
        tls:
          - { name: No TLS,  backend: none }
          - { name: wolfSSL, backend: wolfssl, vcpkg_port: "wolfssl[asio]" }
          - { name: OpenSSL, backend: openssl, vcpkg_port: openssl }

    env:
      CC: clang-${{ matrix.clang }}
      CXX: clang++-${{ matrix.clang }}
      VCPKG_COMMIT: 29f10019c26142cc4689b53b8c91da519db09e5c
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.sanitizer.vcpkg_triplet }}
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/cmake/vcpkg-triplets
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
      ASAN_OPTIONS: "strict_string_checks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"

    steps:
      - uses: actions/checkout@v6

      - name: Remove Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*

      - name: Setup Clang
        uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-${{ matrix.clang }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-${{ matrix.clang }}-dev libc++abi-${{ matrix.clang }}-dev libunwind-${{ matrix.clang }}-dev

      - name: Restore vcpkg binary cache
        if: matrix.tls.vcpkg_port
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.tls.backend }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles(format('cmake/vcpkg-triplets/{0}.cmake', env.VCPKG_DEFAULT_TRIPLET)) }}

      - name: Setup vcpkg
        if: matrix.tls.vcpkg_port
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Install ${{ matrix.tls.name }} (vcpkg)
        if: matrix.tls.vcpkg_port
        run: |
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
          "$VCPKG_ROOT/vcpkg" install "${{ matrix.tls.vcpkg_port }}" --triplet "${VCPKG_DEFAULT_TRIPLET}" --overlay-triplets "${VCPKG_OVERLAY_TRIPLETS}"

      - name: Configure CMake
        shell: bash
        run: |
          sanitizer_flags="${{ matrix.sanitizer.flags }} -fno-sanitize-recover=all -fno-omit-frame-pointer"

          vcpkg_cmake_args=()
          if [[ -n "${{ matrix.tls.vcpkg_port }}" ]]; then
            vcpkg_cmake_args+=("-DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake")
            vcpkg_cmake_args+=("-DVCPKG_TARGET_TRIPLET=${VCPKG_DEFAULT_TRIPLET}")
            vcpkg_cmake_args+=("-DVCPKG_OVERLAY_TRIPLETS=${VCPKG_OVERLAY_TRIPLETS}")
          fi

          cmake -B "${{ github.workspace }}/build-${{ matrix.tls.backend }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DCMAKE_C_COMPILER=${{ env.CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ ${sanitizer_flags}" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi ${sanitizer_flags}" \
            -DAERO_TLS_BACKEND=${{ matrix.tls.backend }} \
            "${vcpkg_cmake_args[@]}"

      - name: Build
        run: cmake --build "build-${{ matrix.tls.backend }}" --parallel

      - name: Test
        working-directory: "build-${{ matrix.tls.backend }}"
        run: ctest --output-on-failure --parallel --timeout 120
